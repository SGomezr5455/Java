databaseChangeLog:
  - changeSet:
      id: 005-create-rooms
      author: ystu-dev
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: rooms
      changes:
        - createTable:
            tableName: rooms
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: building
                  type: VARCHAR(30)
              - column:
                  name: capacity
                  type: INT
              - column:
                  name: room_type
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
