spring.application.name=ystu-schedule

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/ystu_schedule
spring.datasource.username=ystu
spring.datasource.password=ystu
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

management.endpoints.web.exposure.include=health,info,metrics,loggers,env
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=YSTU Schedule API
info.app.version=1.0.0
info.app.description=University schedule management REST API

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

logging.level.com.ystu.schedule=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
